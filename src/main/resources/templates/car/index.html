<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Cars</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="wrapper">
    <div class="container">
        <a th:href="@{/car/create(page=${currentPage}, size=${size})}" class="btn btn-create">Create⊕</a>
        <a class="btn btn-add-all" th:href="@{/car/add-all(page=${currentPage}, size=${size})}">Add 5 Cars</a>
        <a class="btn btn-clear" th:href="@{/car/clear(size=${size})}">Clear</a>

        <form style="margin-top: 5px" id="sizeForm" method="get" th:action="@{/car}">
            <label for="sizeSelect">Show per page: </label>
            <select name="size" id="sizeSelect" onchange="document.getElementById('sizeForm').submit()">
                <option th:value="5" th:selected="${size == 5}">5</option>
                <option th:value="10" th:selected="${size == 10}">10</option>
                <option th:value="20" th:selected="${size == 20}">20</option>
                <option th:value="40" th:selected="${size == 40}">40</option>
                <option th:value="100" th:selected="${size == 100}">100</option>
            </select>
            <input type="hidden" name="page" th:value="${currentPage}">
        </form>

        <label style="margin-top: 5px"  for="sortBy">Sort by: </label>
        <select id="sortBy" onchange="sortBy(this.value)">
            <option value="">-- выберите --</option>
            <option value="all">id</option>
            <option value="model">model</option>
            <option value="marka">marka</option>
            <option value="color">color</option>
            <option value="speed">speed</option>
            <option value="place">place</option>
            <option value="type">type</option>
        </select>
    </div>

    <div class="info">
        <span th:if="${totalCars != 0}" th:text="|Total pages: ${totalPages}|"></span>
        <span th:if="${totalCars != 0}" th:text="|Total cars: ${totalCars}|"></span>
    </div>


    <div>
        <input id="globalFilter" type="text" placeholder="🔎 Search car" onkeyup="search()">
        <div class="search-container">
            <label for="all">All<input type="radio" name="searchField" id="all" th:value="All"></label>
            <label for="model">Model<input type="radio" name="searchField" id="model" th:value="model"></label>
            <label for="marka">Marka<input type="radio" name="searchField" id="marka" th:value="marka"></label>
            <label for="color">Color<input type="radio" name="searchField" id="color" th:value="color"></label>
            <label for="speed">Speed<input type="radio" name="searchField" id="speed" th:value="speed"></label>
            <label for="place">Place<input type="radio" name="searchField" id="place" th:value="place"></label>
            <label for="type">Type<input type="radio" name="searchField" id="type" th:value="type"></label>

        </div>
    </div>


    <table border="1">
        <thead>

        <tr>
            <th>№</th>
            <th>Модель</th>
            <th>Марка</th>
            <th>Цвет</th>
            <th>Скорость</th>
            <th>Количество мест</th>
            <th>Тип кузова</th>
            <th>Редактирование</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="car : ${cars}">
            <td th:text="${car.id}"></td>
            <td th:text="${car.model}"></td>
            <td th:text="${car.marka}"></td>
            <td th:text="${car.color}"></td>
            <td th:text="${car.speed}"></td>
            <td th:text="${car.place}"></td>
            <td th:text="${car.type.getType()}"></td>

            <td class="delete-update-section">
                <form method="post" th:action="@{/car/edit/{id}(id=${car.id}, page=${currentPage}, size=${size})}">
                    <input type="submit" value="Update" class="btn btn-update">
                </form>

                <form onsubmit="return confirm('Вы уверены что хотите удалить?')" th:method="delete"
                      th:action="@{/car/delete/{id}(id=${car.id}, page=${currentPage}, size=${size})}">
                    <input type="submit" value="Delete" class="btn btn-delete">
                </form>
            </td>
        </tr>
        </tbody>

    </table>

    <nav>
        <ul th:if="${totalPages > 0}" class="pagination">
            <li th:if="${currentPage > 1}"><a th:href="@{/car(page=${currentPage - 1}, size=${size})}">Previous</a></li>

            <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                <a th:style="${i == currentPage} ? 'background-color: green;' : ''"
                   th:href="@{/car(page=${i}, size=${size})}" th:text="${i + 1}"></a>
            </li>

            <li th:if="${currentPage < totalPages - 1}"><a
                    th:href="@{/car(page=${currentPage + 1}, size=${size})}">Next</a></li>
        </ul>
    </nav>
</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
